server:
  port: 8081          # start extra instances with: --server.port=8091

spring:
  application:
    name: spot-allocation-service
  datasource:
    # AUTO_SERVER=TRUE lets several JVMs on the same machine share ONE H2 file database. That is required here:
    # with a private in-memory DB per instance, each instance would see different spot state and load balancing
    # would be meaningless. In production replace with PostgreSQL/MySQL (same JPA code, same @Version protection).
    url: ${SPOT_DB_URL:jdbc:h2:file:${user.home}/.parking-lot-demo/spot-db;AUTO_SERVER=TRUE}
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms

parking:
  lock:
    type: redis                    # redis | local   (redis falls back to local if Redis is unreachable)
  allocation:
    default-strategy: BEST_FIT     # NEAREST | BEST_FIT

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
  level:
    com.parking: INFO

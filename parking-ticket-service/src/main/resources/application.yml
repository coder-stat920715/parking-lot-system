server:
  port: 8082

spring:
  application:
    name: parking-ticket-service
  datasource:
    url: ${TICKET_DB_URL:jdbc:h2:file:${user.home}/.parking-lot-demo/ticket-db}
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  cloud:
    loadbalancer:
      cache:
        ttl: 5s                    # refresh instance list every 5s (default 35s) so new/dead instances are noticed fast
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic

parking:
  demo:
    # Lets POST /exit accept "simulatedDurationMinutes" so fees can be demonstrated without waiting. Disable in prod.
    allow-simulated-duration: true
  reconcile:
    interval-ms: 30000
    initial-delay-ms: 30000

resilience4j:
  circuitbreaker:
    instances:
      spotAllocation:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # Only infrastructure failures (5xx, connect/read errors) count. Business 4xx are mapped to
        # ConflictException etc. by the Feign ErrorDecoder and are therefore not recorded.
        record-exceptions:
          - feign.FeignException
  retry:
    instances:
      spotAllocation:
        max-attempts: 3            # allocate/release are idempotent (keyed by ticketNumber) => safe to retry.
        wait-duration: 200ms       # Each retry is re-balanced by Spring Cloud LoadBalancer => instance failover.
        retry-exceptions:
          - feign.FeignException
  ratelimiter:
    instances:
      ticketEntry:
        limit-for-period: 100
        limit-refresh-period: 1s
        timeout-duration: 0

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
    registry-fetch-interval-seconds: 5
  instance:
    prefer-ip-address: true
    instance-id: ${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries
  health:
    circuitbreakers:
      enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{correlationId:-}]"
  level:
    com.parking: INFO
